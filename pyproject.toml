[project]
name = "rpa-crawler"
version = "0.1.0"
description = "Web data collection system: crawlers orchestrated via RabbitMQ, persisted in PostgreSQL, exposed through a FastAPI REST API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "aio-pika>=9.5",
    "pika>=1.3",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "selenium>=4.27",
    "tenacity>=9.0",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "testcontainers[postgres,rabbitmq]>=4.9",
    "types-beautifulsoup4>=4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "A",    # flake8-builtins
    "DTZ",  # flake8-datetimez
    "PIE",  # flake8-pie
    "T20",  # flake8-print
    "S",    # flake8-bandit
    "PERF", # perflint
    "RUF",  # ruff-specific
]
ignore = [
    "B008", # function call in argument defaults (FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # asserts are the point of tests
    "S105", # hardcoded test credentials for throwaway containers
    "S106",
]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pika.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: integration tests that require Docker (Testcontainers)",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/app"]
branch = true
