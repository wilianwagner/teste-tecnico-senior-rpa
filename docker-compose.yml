x-app: &app
  build: .
  image: rpa-crawler:local
  environment:
    DATABASE_URL: postgresql+psycopg://rpa:rpa@postgres:5432/rpa
    RABBITMQ_URL: amqp://rpa:rpa@rabbitmq:5672/
    SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    CRAWL_MAX_ATTEMPTS: ${CRAWL_MAX_ATTEMPTS:-3}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rpa
      POSTGRES_PASSWORD: rpa
      POSTGRES_DB: rpa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpa -d rpa"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: rpa
      RABBITMQ_DEFAULT_PASS: rpa
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10

  selenium:
    image: selenium/standalone-chromium:4.27.0
    shm_size: "2gb"
    environment:
      SE_NODE_MAX_SESSIONS: 1
      SE_NODE_SESSION_TIMEOUT: 120
    ports:
      - "4444:4444"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4444/wd/hub/status > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrations:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              status = urllib.request.urlopen("http://localhost:8000/health", timeout=3).status
          except Exception:
              sys.exit(1)
          sys.exit(0 if status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    <<: *app
    command: ["python", "-m", "app.worker.main"]
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      selenium:
        condition: service_healthy

volumes:
  pgdata:
